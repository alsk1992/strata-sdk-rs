[workspace]
resolver = "2"
members = [
    "crates/strata-public-contract",
    "crates/strata-sdk",
    "crates/strata-agent-cli",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Strata Labs"]
repository = "https://github.com/alsk1992/strata-sdk-rs"
homepage = "https://stratabook.org/docs/agent-sdks"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
strata-public-contract = { version = "0.2.0", path = "crates/strata-public-contract" }
strata-sdk = { version = "0.2.0", path = "crates/strata-sdk" }
