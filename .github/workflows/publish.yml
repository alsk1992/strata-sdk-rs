name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish or resume
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  crates:
    runs-on: ubuntu-latest
    environment: crates-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo test --locked --workspace --all-features
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: python3 -c 'import os,tomllib; v=tomllib.load(open("crates/strata-sdk/Cargo.toml","rb"))["package"]["version"]; assert os.environ["RELEASE_TAG"] == f"v{v}"'
      - name: Publish public contract
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("crates/strata-public-contract/Cargo.toml","rb"))["package"]["version"])')"
          if curl --fail --silent --retry 3 --header "User-Agent: strata-sdk-rs-release/0.1 (github.com/alsk1992/strata-sdk-rs)" --output /dev/null "https://crates.io/api/v1/crates/strata-public-contract/${version}"; then
            echo "strata-public-contract ${version} is already published; continuing"
          else
            cargo publish --locked -p strata-public-contract
          fi
      - name: Wait for public contract index
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("crates/strata-public-contract/Cargo.toml","rb"))["package"]["version"])')"
          for attempt in {1..60}; do
            cargo info "strata-public-contract@${version}" --registry crates-io >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "strata-public-contract ${version} did not become available through Cargo" >&2
          exit 1
      - name: Publish SDK
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("crates/strata-sdk/Cargo.toml","rb"))["package"]["version"])')"
          if curl --fail --silent --retry 3 --header "User-Agent: strata-sdk-rs-release/0.1 (github.com/alsk1992/strata-sdk-rs)" --output /dev/null "https://crates.io/api/v1/crates/strata-sdk/${version}"; then
            echo "strata-sdk ${version} is already published; continuing"
          else
            cargo publish --locked -p strata-sdk
          fi
      - name: Wait for SDK index
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("crates/strata-sdk/Cargo.toml","rb"))["package"]["version"])')"
          for attempt in {1..60}; do
            cargo info "strata-sdk@${version}" --registry crates-io >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "strata-sdk ${version} did not become available through Cargo" >&2
          exit 1
      - name: Publish terminal client
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("crates/strata-agent-cli/Cargo.toml","rb"))["package"]["version"])')"
          if curl --fail --silent --retry 3 --header "User-Agent: strata-sdk-rs-release/0.1 (github.com/alsk1992/strata-sdk-rs)" --output /dev/null "https://crates.io/api/v1/crates/strata-agent-cli/${version}"; then
            echo "strata-agent-cli ${version} is already published; continuing"
          else
            cargo publish --locked -p strata-agent-cli
          fi
