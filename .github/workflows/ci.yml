name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo package --locked -p strata-public-contract
      - name: Package SDK when its contract version is indexed
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("crates/strata-public-contract/Cargo.toml","rb"))["package"]["version"])')"
          if cargo info "strata-public-contract@${version}" --registry crates-io >/dev/null 2>&1; then
            cargo package --locked -p strata-sdk
          else
            echo "contract bootstrap pending; workspace tests passed"
          fi
      - name: Package terminal client when its SDK version is indexed
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("crates/strata-sdk/Cargo.toml","rb"))["package"]["version"])')"
          if cargo info "strata-sdk@${version}" --registry crates-io >/dev/null 2>&1; then
            cargo package --locked -p strata-agent-cli
          else
            echo "SDK bootstrap pending; workspace tests passed"
          fi
