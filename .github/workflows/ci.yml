name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo package --locked -p strata-public-contract
      - name: Package SDK when its contract version is indexed
        run: if cargo search strata-public-contract --limit 1 | grep -q '^strata-public-contract = "0.1.0"'; then cargo package --locked -p strata-sdk; else echo "contract bootstrap pending; workspace tests passed"; fi
      - name: Package terminal client when its SDK version is indexed
        run: if cargo search strata-sdk --limit 1 | grep -q '^strata-sdk = "0.1.0"'; then cargo package --locked -p strata-agent-cli; else echo "SDK bootstrap pending; workspace tests passed"; fi
